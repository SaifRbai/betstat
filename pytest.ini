[pytest]
testpaths = tests
# soccerdata installe seleniumbase, qui apporte plusieurs greffons pytest bruyants
# (dont un qui ouvre une socket au demarrage). On les desactive : les tests de ce
# projet doivent tourner avec le reseau coupe.
addopts = -q -p no:seleniumbase -p no:rerunfailures -p no:pytest-html -p no:xdist
filterwarnings =
    ignore::DeprecationWarning
